[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-footprint"
version = "0.1.0"
description = "Reveal filesystem changes that coding-agent terminal commands leave behind."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Amossse" }]
keywords = ["ai-agents", "coding-agents", "filesystem", "audit", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.scripts]
agent-footprint = "agent_footprint.cli:main"

[project.urls]
Homepage = "https://github.com/Amossse/agent-footprint"
Issues = "https://github.com/Amossse/agent-footprint/issues"

[tool.setuptools.packages.find]
where = ["src"]
